<section class="finance-card finance-stack" aria-labelledby="login-heading">
  <h1 class="finance-text-1" id="login-heading">Login</h1>

  <form class="finance-form" (submit)="$event.preventDefault()">
    <div class="finance-form-fields">
      <div class="finance-field">
        <label class="finance-label" for="login-email">Email</label>
        <input
          class="finance-input"
          id="login-email"
          name="email"
          type="email"
          autocomplete="username"
          spellcheck="false"
          required
        >
      </div>

      <div class="finance-field">
        <label class="finance-label" for="login-password">Password</label>
        <div class="finance-input-group">
          <input
            class="finance-input"
            id="login-password"
            name="password"
            [type]="passwordVisible ? 'text' : 'password'"
            autocomplete="current-password"
            required
          >
          <button
            class="finance-input-action"
            type="button"
            [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'"
            aria-controls="login-password"
            [attr.aria-pressed]="passwordVisible"
            (click)="passwordVisible = !passwordVisible"
          >
            <img
              [src]="passwordVisible ? 'assets/images/icon-hide-password.svg' : 'assets/images/icon-show-password.svg'"
              alt=""
            >
          </button>
        </div>
      </div>
    </div>

    <button class="finance-button finance-button--primary finance-button--block" type="submit">Login</button>
  </form>

  <p class="finance-inline-prompt">
    <span>Need to create an account?</span>
    <a class="finance-link" routerLink="/auth/register">Sign Up</a>
  </p>
</section>
